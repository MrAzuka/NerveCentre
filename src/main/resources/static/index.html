<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NerveCentre — Live Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b1020;
            --bg-secondary: #111827;
            --card: rgba(17, 24, 39, 0.72);
            --card-border: rgba(255,255,255,0.08);
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #60a5fa;
            --primary-2: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        body {
            background: radial-gradient(circle at top left, #1e293b 0%, #0b1020 45%, #050816 100%);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(14px);
            background: rgba(11,16,32,0.72);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1::before {
            content: "";
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 0 16px rgba(96,165,250,.8);
        }

        #connection-status {
            font-size: 12px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--muted);
        }

        #connection-status.connected {
            background: rgba(34,197,94,0.12);
            border-color: rgba(34,197,94,0.25);
            color: #86efac;
        }

        /* Layout */
        .main {
            padding: 32px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
            margin-bottom: 16px;
        }

        /* Metric Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(96,165,250,.10), rgba(129,140,248,.05));
            pointer-events: none;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: rgba(96,165,250,.35);
            box-shadow: 0 18px 36px rgba(0,0,0,.45);
        }

        .metric-card.spiked {
            border-color: rgba(239,68,68,.55);
            box-shadow: 0 0 0 1px rgba(239,68,68,.2), 0 16px 36px rgba(239,68,68,.18);
        }

        .metric-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #ffffff 0%, #bfdbfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .metric-unit {
            font-size: 13px;
            color: var(--muted);
        }

        /* Chart */
        .chart-container,
        .alerts-panel {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 22px;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
        }

        .chart-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .chart-btn {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.06);
            color: var(--muted);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s ease;
        }

        .chart-btn:hover {
            background: rgba(96,165,250,.12);
            color: #dbeafe;
            border-color: rgba(96,165,250,.28);
        }

        .chart-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 10px 24px rgba(96,165,250,.32);
        }

        canvas {
            max-height: 280px;
        }

        /* Alerts */
        .alerts-panel {
            max-height: 84vh;
            overflow-y: auto;
        }

        .alerts-panel::-webkit-scrollbar { width: 8px; }
        .alerts-panel::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.10);
            border-radius: 999px;
        }

        .alert-item {
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.05);
            border-left: 4px solid var(--danger);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            animation: slideIn .28s ease;
        }

        .alert-item.WARNING { border-left-color: var(--warning); }
        .alert-item.CRITICAL { border-left-color: var(--danger); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .alert-metric {
            font-size: 14px;
            font-weight: 700;
        }

        .alert-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 999px;
            letter-spacing: 0.08em;
        }

        .alert-badge.WARNING {
            background: rgba(245,158,11,.16);
            color: #fbbf24;
        }

        .alert-badge.CRITICAL {
            background: rgba(239,68,68,.16);
            color: #fca5a5;
        }

        .alert-value {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .alert-explanation {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.55;
        }

        .alert-time {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
        }

        .no-alerts {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            padding: 52px 0;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main {
                grid-template-columns: 1fr;
            }

            .alerts-panel {
                max-height: none;
            }
        }

        @media (max-width: 640px) {
            header, .main {
                padding: 18px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>NerveCentre</h1>
    <span id="connection-status">Connecting...</span>
</header>

<div class="main">
    <div>
        <p class="section-title">Live Metrics</p>
        <div class="metrics-grid" id="metrics-grid"></div>

        <div class="chart-container">
            <p class="section-title">Metric History</p>
            <div class="chart-selector" id="chart-selector"></div>
            <canvas id="metricChart"></canvas>
        </div>
    </div>

    <div>
        <p class="section-title">Live Alerts</p>
        <div class="alerts-panel" id="alerts-panel">
            <p class="no-alerts">✨ No active alerts — all systems operating normally</p>
        </div>
    </div>
</div>

<script>
    // ── State ──────────────────────────────────────────
    const metricHistory = {};
    const MAX_POINTS = 30;
    let activeMetric = null;
    let chart = null;

    // ── Chart setup ────────────────────────────────────
    function initChart() {
        const ctx = document.getElementById('metricChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{
                    label: '',
                    data: [],
                    borderColor: '#60a5fa',
                    backgroundColor: 'rgba(96,165,250,0.18)',
                    borderWidth: 3,
                    pointRadius: 0,
                    pointHoverRadius: 5,
                    pointBackgroundColor: '#93c5fd',
                    tension: 0.45,
                    fill: true
                }]},
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 250 },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#111827',
                        borderColor: 'rgba(255,255,255,0.08)',
                        borderWidth: 1,
                        titleColor: '#fff',
                        bodyColor: '#cbd5e1'
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#64748b', maxTicksLimit: 6 },
                        grid: { color: 'rgba(255,255,255,0.04)' }
                    },
                    y: {
                        ticks: { color: '#64748b' },
                        grid: { color: 'rgba(255,255,255,0.06)' }
                    }
                }
            }
        });
    }

    function updateChart(metricName) {
        if (!chart || !metricHistory[metricName]) return;
        activeMetric = metricName;
        const history = metricHistory[metricName];
        chart.data.labels = history.map(p => new Date(p.time).toLocaleTimeString());
        chart.data.datasets[0].data = history.map(p => p.value);
        chart.data.datasets[0].label = metricName;
        chart.update();

        // Update button states
        document.querySelectorAll('.chart-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.metric === metricName);
        });
    }

    // ── Metric card ────────────────────────────────────
    function updateMetricCard(metricName, value) {
        let card = document.getElementById('card-' + metricName);

        if (!card) {
            // Create card
            card = document.createElement('div');
            card.className = 'metric-card';
            card.id = 'card-' + metricName;
            card.innerHTML = `
        <div class="metric-name">${metricName.replace(/_/g, ' ')}</div>
        <div class="metric-value" id="val-${metricName}">-</div>
        <div class="metric-unit">latest value</div>
      `;
            document.getElementById('metrics-grid').appendChild(card);

            // Add chart button
            const btn = document.createElement('button');
            btn.className = 'chart-btn';
            btn.dataset.metric = metricName;
            btn.textContent = metricName.replace(/_/g, ' ');
            btn.onclick = () => updateChart(metricName);
            document.getElementById('chart-selector').appendChild(btn);

            // Auto-select first metric
            if (!activeMetric) updateChart(metricName);
        }

        document.getElementById('val-' + metricName).textContent =
            parseFloat(value).toFixed(2);
    }

    // ── Alert card ─────────────────────────────────────
    function addAlert(alert) {
        const panel = document.getElementById('alerts-panel');
        const noAlerts = panel.querySelector('.no-alerts');
        if (noAlerts) noAlerts.remove();

        // Flash the metric card red
        const card = document.getElementById('card-' + alert.metricName);
        if (card) {
            card.classList.add('spiked');
            setTimeout(() => card.classList.remove('spiked'), 3000);
        }

        const item = document.createElement('div');
        item.className = `alert-item ${alert.severity}`;
        item.innerHTML = `
      <div class="alert-header">
        <span class="alert-metric">${alert.metricName.replace(/_/g, ' ')}</span>
        <span class="alert-badge ${alert.severity}">${alert.severity}</span>
      </div>
      <div class="alert-value">
        Value: <strong>${parseFloat(alert.value).toFixed(2)}</strong>
        &nbsp;·&nbsp; Z-score: <strong>${parseFloat(alert.zScore).toFixed(2)}</strong>
      </div>
      ${alert.explanation
            ? `<div class="alert-explanation">${alert.explanation}</div>`
            : ''}
      <div class="alert-time">${new Date(alert.time).toLocaleTimeString()}</div>
    `;

        panel.insertBefore(item, panel.firstChild);

        // Keep only last 20 alerts in the panel
        const items = panel.querySelectorAll('.alert-item');
        if (items.length > 20) items[items.length - 1].remove();
    }

    // ── WebSocket ──────────────────────────────────────
    function connect() {
        const socket = new SockJS('/ws');
        const stompClient = Stomp.over(socket);
        stompClient.debug = null; // silence console noise

        stompClient.connect({}, () => {
            document.getElementById('connection-status').textContent = 'Connected';
            document.getElementById('connection-status').classList.add('connected');

            // Subscribe to metrics
            stompClient.subscribe('/topic/metrics', message => {
                const data = JSON.parse(message.body);

                if (!metricHistory[data.metricName]) {
                    metricHistory[data.metricName] = [];
                }

                metricHistory[data.metricName].push({
                    time: data.time,
                    value: data.value
                });

                // Keep only last 30 points
                if (metricHistory[data.metricName].length > MAX_POINTS) {
                    metricHistory[data.metricName].shift();
                }

                updateMetricCard(data.metricName, data.value);

                if (activeMetric === data.metricName) {
                    updateChart(data.metricName);
                }
            });

            // Subscribe to alerts
            stompClient.subscribe('/topic/alerts', message => {
                const alert = JSON.parse(message.body);
                addAlert(alert);
            });

        }, error => {
            document.getElementById('connection-status').textContent = 'Disconnected';
            document.getElementById('connection-status').classList.remove('connected');
            // Reconnect after 3 seconds
            setTimeout(connect, 3000);
        });
    }

    // ── Init ───────────────────────────────────────────
    initChart();
    connect();
</script>
</body>
</html>
